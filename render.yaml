services:
  - type: web
    name: etfc-app
    env: python
    buildCommand: pip install -r requirements.txt && cd miniapp && VITE_API_BASE_URL=https://etfc-app.onrender.com npm install && VITE_API_BASE_URL=https://etfc-app.onrender.com npm run build && cd ../admin && VITE_API_BASE_URL=https://etfc-app.onrender.com npm install && VITE_API_BASE_URL=https://etfc-app.onrender.com npm run build
    startCommand: bash start.sh
    envVars:
      # Set ETFC_DATABASE_URL in Render's dashboard — do NOT commit plaintext credentials
      - key: ETFC_WAGERING_ENABLED
        value: false
      - key: ETFC_CORS_ALLOW_ORIGINS
        value: "*"
      - key: ETFC_ADMIN_TOKEN
        generateValue: true
      - key: ETFC_TELEGRAM_BOT_TOKEN
        sync: false
      - key: ETFC_MINI_APP_URL
        value: https://etfc-app.onrender.com/miniapp
      - key: ETFC_TELEBIRR_VERIFY_ENABLED
        value: true
      - key: ETFC_LICENSE_NUMBER
        sync: false
